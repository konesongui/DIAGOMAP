<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagoma - Hors ligne</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            text-align: center;
            padding: 20px;
        }
        
        .offline-container {
            max-width: 420px;
            padding: 40px 30px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            animation: fadeInUp 0.6s ease;
        }
        
        .offline-icon {
            font-size: 72px;
            margin-bottom: 20px;
            display: block;
        }
        
        .offline-container h1 {
            color: #273772;
            font-size: 28px;
            margin-bottom: 12px;
            font-weight: 700;
        }
        
        .offline-container p {
            color: #64748b;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        
        .offline-container .sub-message {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 5px;
        }
        
        .retry-btn {
            background: linear-gradient(135deg, #273772, #1a1a4e);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(39, 55, 114, 0.3);
        }
        
        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(39, 55, 114, 0.4);
        }
        
        .retry-btn:active {
            transform: scale(0.96);
        }
        
        .offline-features {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #f0f2f5;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .offline-features span {
            color: #94a3b8;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .offline-features span i {
            font-size: 16px;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .offline-container {
                padding: 30px 20px;
            }
            .offline-icon {
                font-size: 56px;
            }
            .offline-container h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <span class="offline-icon">📡</span>
        <h1>Vous êtes hors ligne</h1>
        <p>Vous pouvez continuer à utiliser les pages déjà consultées même sans connexion.</p>
        <p class="sub-message">Les nouvelles saisies seront stockées localement puis synchronisées automatiquement dès le retour d’Internet.</p>
        
        <button class="retry-btn" onclick="location.reload()">
            🔄 Réessayer
        </button>
        
        <div class="offline-features">
            <span>📱 Application installée</span>
            <span>💾 Saisie locale</span>
            <span>🔄 Synchronisation auto</span>
        </div>
    </div>
</body>
</html>
